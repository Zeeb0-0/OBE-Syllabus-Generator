<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OBE Syllabus Generator{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="topbar">
  <a class="brand" href="{{ url_for('index') }}">OBE Syllabus Generator</a>
  <span class="pipeline">LLM &rarr; JSON &rarr; Pydantic &rarr; SQLite &rarr; Human edit &rarr; Jinja2 &rarr; HTML</span>
</nav>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
